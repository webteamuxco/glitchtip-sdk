allowBuilds:
  '@nestjs/core': false
  '@sentry/cli': false
  esbuild: false
  sharp: false

# Security floors for devDependency transitives the ranges don't move on their own.
overrides:
  shell-quote@1: ^1.11.0
  image-size@1: 2.0.4
  brace-expansion@2: ^2.1.7
  browserslist@4: ^4.28.7
  fast-uri@3: ^3.1.8
  postcss@8: ^8.5.23
